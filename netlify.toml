# Static site — nothing to build, the repo root is what gets published.
[build]
  publish = "."

# The photos are content-addressed by folder + filename and never change in
# place, so let browsers hold on to them.
[[headers]]
  for = "/assets/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
