<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominica Sol</title>
<meta name="description" content="Dominica Sol — ceramic artist. Claws and Teeth: hand-built ceramic objects and jewellery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">Dominica Sol</a>
  <a class="header-aside" href="https://www.instagram.com/domisolmido/" data-ig target="_blank" rel="noopener">Instagram</a>
  <nav class="nav" id="nav">
    <a href="index.html">About</a>
    <a href="shop.html">Shop</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
<section class="hero wrap">
  <div class="hero__media">
    <img id="hero-image" src="assets/web/perfil/mood.jpg" alt="Collecting material in the field">
  </div>
</section>

<div class="wrap">
  <div class="split about-split reveal">
    <img id="portrait" src="assets/web/perfil/profile.jpg" alt="Portrait of Dominica Sol">
    <div class="split__text">
      <p class="caps">About</p>
      <div id="about-text"></div>
      <a class="caps accent hover-accent" href="shop.html">See the work →</a>
    </div>
  </div>

  <div class="split about-split about-split--flip reveal">
    <img id="earrings-image" src="assets/web/shop/earrings-05/1.jpg" alt="Ceramic earrings by Dominica Sol">
    <div class="split__text">
      <p class="caps">Earrings</p>
      <div id="earrings-text"></div>
      <a class="caps accent hover-accent" href="shop.html?c=Earrings">See the earrings →</a>
    </div>
  </div>

  <div class="exhibitions reveal">
    <p class="caps">Selected exhibitions</p>
    <div id="exhibitions"></div>
  </div>
</div>

<section id="contact" class="contact-section">
  <div class="page-intro wrap">
    <h1>Contact</h1>
    <p id="contact-intro"></p>
  </div>
  <div class="contact-grid contact-grid--single wrap">
    <a class="caps accent hover-accent contact-cta" href="https://www.instagram.com/domisolmido/" data-ig target="_blank" rel="noopener">Message on Instagram →</a>
    <dl class="spec">
      <div><dt>Instagram</dt><dd><a class="hover-accent" href="https://www.instagram.com/domisolmido/" data-ig data-ig-handle target="_blank" rel="noopener">@domisolmido</a></dd></div>
      <div><dt>Studio</dt><dd id="studio-address"></dd></div>
      <div><dt>Visits</dt><dd id="visits"></dd></div>
    </dl>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="site-footer__links">
    <a href="shop.html">Shop</a>
    <a href="index.html#contact">Contact</a>
    <a href="https://www.instagram.com/domisolmido/" data-ig target="_blank" rel="noopener">Instagram</a>
  </div>
  <p class="colophon">© <span id="year">2026</span> Dominica Sol · Photography © Pablo Hassmann</p>
</footer>
<script src="js/data.js"></script>
<script src="js/cards.js"></script>
<script src="js/main.js"></script>
<script src="js/home.js"></script>
</body>
</html>
